name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.21.2   # confira/atualize a versao
  TRIVY_IMAGE: aquasec/trivy:0.58.1                    # confira/atualize a versao
  SEMGREP_VERSION: "1.183.0"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Varrer segredos nos commits desta execucao
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            RANGE="$PR_BASE..$PR_HEAD"
          elif [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            RANGE="$PUSH_BEFORE..$SHA"
          else
            RANGE=""   # primeiro push da branch: varre tudo
          fi
          echo "Intervalo varrido: ${RANGE:-historico completo}"
          docker run --rm -v "$PWD:/repo" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            "$GITLEAKS_IMAGE" detect --source /repo --redact -v \
            ${RANGE:+--log-opts="$RANGE"}

  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "semgrep==$SEMGREP_VERSION"
      - run: semgrep scan --config p/default --error --metrics=off app

  image:
    needs: [test, gitleaks, semgrep]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      PUBLICAR: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${REPO,,}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker build -t "$IMAGE:$SHA" -t "$IMAGE:latest" .
      - name: Trivy na imagem (barra CRITICAL/HIGH com correcao disponivel)
        env:
          SHA: ${{ github.sha }}
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 "$IMAGE:$SHA"
      - name: Publicar no GHCR (so na main)
        if: env.PUBLICAR == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker push "$IMAGE:$SHA"
          docker push "$IMAGE:latest"

  ci-ok:
    if: always()
    needs: [test, gitleaks, semgrep, image]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Falha se algum job falhou ou foi cancelado
        env:
          RESULTADOS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Resultados: $RESULTADOS"
          case "$RESULTADOS" in *failure*|*cancelled*) exit 1;; esac

  deploy:
    needs: [ci-ok]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}
      INSTANCE_ID: ${{ secrets.INSTANCE_ID }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - name: Atualizar o container na EC2 via SSM (sem porta 22)
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${REPO,,}:$SHA"
          CMD_ID=$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$INSTANCE_ID" \
            --parameters "commands=[\"docker pull $IMAGE\",\"docker rm -f app || true\",\"docker run -d --name app --restart unless-stopped -p 80:8000 -v /opt/luzviva/data:/data --env-file /opt/luzviva/app.env -e LUZVIVA_DATA_DIR=/data -e ENABLE_FAULT_ENDPOINT=true $IMAGE\"]" \
            --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID"
      - name: Conferir /health
        run: curl --fail --silent --show-error --retry 6 --retry-delay 5 --retry-connrefused "$APP_URL/health"
