name: ci

on:
  pull_request:
  push:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.21.2   # confira/atualize a versao
  TRIVY_IMAGE: aquasec/trivy:0.58.1                    # confira/atualize a versao
  SEMGREP_VERSION: "1.183.0"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Varrer segredos nos commits desta execucao
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            RANGE="$PR_BASE..$PR_HEAD"
          elif [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            RANGE="$PUSH_BEFORE..$SHA"
          else
            # primeiro push da branch: so os commits que ainda nao estao na main
            RANGE="origin/${DEFAULT_BRANCH}..$SHA"
          fi
          echo "Intervalo varrido: ${RANGE:-historico completo}"
          docker run --rm -v "$PWD:/repo" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            "$GITLEAKS_IMAGE" detect --source /repo --redact -v \
            ${RANGE:+--log-opts="$RANGE"}

  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "semgrep==$SEMGREP_VERSION"
      - run: semgrep scan --config p/default --error --metrics=off app

  image:
    needs: [test, gitleaks, semgrep]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      PUBLICAR: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${REPO,,}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker build --build-arg APP_COMMIT="$SHA" -t "$IMAGE:$SHA" -t "$IMAGE:latest" .
      - name: Conferir usuario nao root na imagem
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker run --rm --entrypoint id "$IMAGE:$SHA" | tee /tmp/id.txt
          grep -q "uid=10001(appuser)" /tmp/id.txt || { echo "::error::container roda como root"; exit 1; }
          echo "Usuario do container: $(docker image inspect -f '{{.Config.User}}' "$IMAGE:$SHA")"
      - name: Trivy na imagem (barra CRITICAL/HIGH com correcao disponivel)
        env:
          SHA: ${{ github.sha }}
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 "$IMAGE:$SHA"
      - name: Publicar no GHCR (so na main)
        if: env.PUBLICAR == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker push "$IMAGE:$SHA"
          docker push "$IMAGE:latest"

  compose:
    # Prova que a stack inteira sobe com docker compose: app + Prometheus + Grafana.
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Subir a stack
        run: |
          set -euo pipefail
          export GRAFANA_PASSWORD="$(openssl rand -hex 16)"
          docker compose up -d --build
          docker compose ps
      - name: Conferir app, Prometheus e Grafana
        run: |
          set -euo pipefail
          curl -fsS --retry 10 --retry-delay 3 --retry-all-errors http://localhost:8000/health; echo
          curl -fsS --retry 10 --retry-delay 3 --retry-all-errors http://localhost:9090/-/ready; echo
          curl -fsS --retry 10 --retry-delay 3 --retry-all-errors http://localhost:3000/api/health; echo
          sleep 20
          curl -fsS "http://localhost:9090/api/v1/query?query=up" | tee /tmp/up.json; echo
          grep -q '"value":\[[0-9.]*,"1"\]' /tmp/up.json
      - name: Derrubar a stack
        if: always()
        run: GRAFANA_PASSWORD=x docker compose down -v

  ci-ok:
    if: always()
    needs: [test, gitleaks, semgrep, image, compose]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Falha se algum job falhou ou foi cancelado
        env:
          RESULTADOS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Resultados: $RESULTADOS"
          case "$RESULTADOS" in *failure*|*cancelled*) exit 1;; esac

  deploy:
    # Deploy por pull: a EC2 confere o GHCR a cada minuto e troca o container quando a
    # imagem :latest muda. Nenhuma credencial da AWS fica no GitHub. Este job confirma,
    # com o DEPLOY_TOKEN (GitHub Secrets; na AWS fica no SSM Parameter Store), que o
    # commit entrou no ar.
    needs: [ci-ok]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      APP_URL: ${{ vars.APP_URL }}
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
      SHA: ${{ github.sha }}
    steps:
      - name: Esperar a EC2 publicar este commit
        run: |
          set -uo pipefail
          if [ -z "$DEPLOY_TOKEN" ]; then echo "::error::secret DEPLOY_TOKEN nao configurado"; exit 1; fi
          for i in $(seq 1 40); do
            ATUAL=$(curl -fsS --max-time 5 -H "X-Deploy-Token: $DEPLOY_TOKEN" "$APP_URL/internal/deploy" \
              | python3 -c "import sys,json; print(json.load(sys.stdin).get('commit',''))" || true)
            echo "tentativa $i: no ar = ${ATUAL:-indisponivel}"
            if [ "$ATUAL" = "$SHA" ]; then echo "Deploy confirmado: $SHA"; exit 0; fi
            sleep 15
          done
          echo "::error::A versao $SHA nao entrou no ar em 10 minutos"
          exit 1
