# Aponta o Prometheus local para o MVP publicado. Troque o IP pelo output app_ip do Terraform.
global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/rules.yml
scrape_configs:
  - job_name: luzviva-app
    metrics_path: /metrics
    static_configs:
      - targets: ["0.0.0.0:80"]   # TROCAR: <IP_ELASTICO>:80
