# Prometheus local lendo o MVP publicado na AWS (sa-east-1).
# Uso: no .env, PROM_CONFIG=prometheus.remote.yml; depois: docker compose up prometheus grafana
global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/rules.yml
scrape_configs:
  - job_name: luzviva-app
    metrics_path: /metrics
    static_configs:
      - targets: ["52.67.217.30:80"]
        labels:
          ambiente: producao-aws
